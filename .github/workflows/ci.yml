name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Vérifier les types
        run: npm run check

      - name: Tests unitaires (IA simulée)
        run: npm test

      - name: Installer Chromium
        run: npx playwright install --with-deps chromium

      - name: Tests de bout en bout et d'accessibilité (IA simulée)
        run: npm run test:e2e

      - name: Produire le compte rendu
        if: always()
        run: npm run test:report

      - name: Écrire le compte rendu dans la description de la PR
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh pr view "$PR_NUMBER" --json body --jq .body > pr-body.md
          node -e '
            const fs = require("node:fs");
            const body = fs.readFileSync("pr-body.md", "utf8");
            const report = fs.readFileSync("test-results/report.md", "utf8").trim();
            const start = "<!-- test-report:start -->";
            const end = "<!-- test-report:end -->";
            const block = `${start}\n${report}\n${end}`;
            const re = /<!-- test-report:start -->[\s\S]*?<!-- test-report:end -->/;
            const next = re.test(body) ? body.replace(re, () => block) : `${body.trimEnd()}\n\n${block}\n`;
            fs.writeFileSync("pr-body.md", next);
          '
          gh pr edit "$PR_NUMBER" --body-file pr-body.md

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
